services:
  - type: web
    name: sakra-face-detection-project
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: MAKEFLAGS
        value: "-j1"
      - key: CMAKE_BUILD_PARALLEL_LEVEL
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://lens.sakra-vision.online
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "13350"
      - key: DB_NAME
        value: smart_attendance
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_DISABLED
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Likith Naidu <noreply@mail.likith-portfolio.online>
      - key: API_MASTER_PASSKEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: TIMEZONE
        value: Asia/Kolkata
